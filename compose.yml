name: brica-dev

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT:-5433}:5432"

    volumes:
      - brica_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  brica-server:
    restart: unless-stopped
    build:
      context: .
      dockerfile: brica-server/Dockerfile

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      BRICA_ALLOW_HTTP: ${BRICA_ALLOW_HTTP:-false}

    ports:
      - "${BRICA_SERVER_PORT:-8080}:8080"

    # Volumen persistente de archivos; se conserva el nombre histórico para no perder archivos existentes.
    volumes:
      - brica_document_test_files:/app/var/documents

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  brica_postgres_data:
  brica_document_test_files:
