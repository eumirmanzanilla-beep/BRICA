spring:
  application:
    name: brica-server

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/brica}
    username: ${DB_USER:brica}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true